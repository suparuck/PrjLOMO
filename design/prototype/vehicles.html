<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รถทั้งหมด — EV Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="vehicles" data-title="รถทั้งหมด" data-sub="จัดการและติดตามรถยนต์ไฟฟ้าทุกคันในกองยาน">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <section class="grid g-4 mb kpi-grid-2m" id="kpis"></section>

      <section class="card flush">
        <div style="padding:18px 22px 0">
          <div class="toolbar">
            <div class="chips" id="chips"></div>
            <div class="flex wrap">
              <label class="search-input"><span data-icon="search" data-size="16"></span><input id="q" type="search" placeholder="ค้นหา รหัสรถ รุ่น ทะเบียน คนขับ"></label>
              <select class="select" id="sort" style="width:auto">
                <option value="id">เรียงตามรหัสรถ</option>
                <option value="soc-asc">แบตน้อย → มาก</option>
                <option value="soc-desc">แบตมาก → น้อย</option>
                <option value="range-desc">ระยะวิ่งมากสุด</option>
              </select>
              <button class="btn btn-outline" data-icon="download" data-size="16" onclick="exportCsv()">ส่งออก</button>
              <button class="btn btn-primary" data-icon="plus" data-size="16">เพิ่มรถ</button>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr><th>รถ</th><th>ทะเบียน</th><th>คนขับ</th><th>แบตเตอรี่</th><th class="r">SoH</th><th class="r">ระยะวิ่งคงเหลือ</th><th class="r">เลขไมล์</th><th>ตำแหน่งล่าสุด</th><th>สถานะ</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" hidden>ไม่พบรถที่ตรงกับเงื่อนไข</div>
        <div class="flex between" style="padding:14px 22px;border-top:1px solid var(--line-2)">
          <span class="small muted" id="countText"></span>
          <div class="flex"><button class="btn btn-outline btn-sm" disabled>ก่อนหน้า</button><button class="btn btn-outline btn-sm" disabled>ถัดไป</button></div>
        </div>
      </section>

    </main>
    <footer class="app-foot"><span>อัปเดตล่าสุด: วันนี้ 10:30 น.</span><span>© 2026 EV Monitor Dashboard</span></footer>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
let filter = "all";
function init() {
  const V = EV.vehicles;
  const avgSoh = (V.reduce((s, v) => s + v.soh, 0) / V.length).toFixed(1);
  const totalRange = V.reduce((s, v) => s + v.range, 0);
  const totalOdo = V.reduce((s, v) => s + v.odo, 0);
  document.getElementById("kpis").innerHTML = [
    ["รถไฟฟ้าทั้งหมด", V.length, "คัน", "6 ยี่ห้อ 9 รุ่น", "car", "t-navy"],
    ["ระยะวิ่งคงเหลือรวม", fmt(totalRange), "กม.", "จากแบตปัจจุบัน", "route", "t-blue"],
    ["สุขภาพแบตเฉลี่ย (SoH)", avgSoh, "%", "อยู่ในเกณฑ์ดี", "shield", "t-green"],
    ["เลขไมล์สะสม", fmt(totalOdo), "กม.", "ทั้งกองยาน", "speed", "t-amber"],
  ].map(([l, v, u, n, i, t]) => `<div class="card kpi"><div class="kpi-ico ${t}">${icon(i, 22)}</div><div><div class="kpi-label">${l}</div><div class="kpi-value">${v}<small>${u}</small></div><div class="kpi-note">${n}</div></div></div>`).join("");

  const chipDefs = [["all", "ทั้งหมด"], ...Object.entries(STATUS).map(([k, s]) => [k, s.th])];
  const chips = document.getElementById("chips");
  chips.innerHTML = chipDefs.map(([k, l]) => `<button class="chip ${k === "all" ? "active" : ""}" data-k="${k}">${l} <em>${k === "all" ? V.length : V.filter(v => v.status === k).length}</em></button>`).join("");
  chips.onclick = e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.k; chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b)); render();
  };
  const q = document.getElementById("q");
  q.value = qs("q") || "";
  q.oninput = render;
  document.getElementById("sort").onchange = render;
  render();
}
function current() {
  const term = document.getElementById("q").value.trim().toLowerCase();
  const sort = document.getElementById("sort").value;
  let list = EV.vehicles.filter(v => (filter === "all" || v.status === filter) &&
    (!term || [v.id, v.model, v.plate, EV.driverById(v.driver).name, v.loc].join(" ").toLowerCase().includes(term)));
  const s = { "soc-asc": (a, b) => a.soc - b.soc, "soc-desc": (a, b) => b.soc - a.soc, "range-desc": (a, b) => b.range - a.range, id: (a, b) => a.id.localeCompare(b.id) };
  return list.sort(s[sort]);
}
function render() {
  const list = current();
  document.getElementById("rows").innerHTML = list.map(v => `
    <tr>
      <td><a class="veh" href="vehicle.html?id=${v.id}"><span class="veh-ico">${icon(v.status === "charging" ? "bolt" : "car", 18)}</span><span><strong>${v.id}</strong><small>${v.model}</small></span></a></td>
      <td><span class="tag">${v.plate}</span></td>
      <td>${EV.driverById(v.driver).name}</td>
      <td>${socBar(v.soc)}</td>
      <td class="r">${v.soh}%</td>
      <td class="r">${v.range} กม.</td>
      <td class="r">${fmt(v.odo)}</td>
      <td>${v.loc}</td>
      <td>${statusBadge(v.status)}</td>
      <td><a class="btn btn-ghost btn-sm" href="vehicle.html?id=${v.id}">ดู</a></td>
    </tr>`).join("");
  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("countText").textContent = `แสดง ${list.length} จาก ${EV.vehicles.length} คัน`;
}
function exportCsv() {
  const head = "id,model,plate,driver,soc,soh,range,odo,location,status";
  const rows = current().map(v => [v.id, v.model, v.plate, EV.driverById(v.driver).name, v.soc, v.soh, v.range, v.odo, v.loc, v.status].join(","));
  const blob = new Blob(["﻿" + [head, ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "ev-vehicles.csv" });
  a.click();
}
</script>
</body>
</html>
