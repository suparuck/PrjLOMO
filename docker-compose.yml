# EV Monitor — 3 container แยกกัน: db (PostgreSQL) · api (Fastify) · web (Next.js)
# เริ่ม:        docker compose up --build -d
# ล้างข้อมูล:    docker compose down -v   (ลบ volume แล้ว db จะสร้างใหม่จาก db/init/*.sql)
services:
  db:
    build: ./db
    image: ev-monitor-db:latest
    command: ["postgres", "-c", "timezone=Asia/Bangkok"]
    environment:
      POSTGRES_USER: evm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?กำหนด POSTGRES_PASSWORD ในไฟล์ .env (ดู .env.example)}
      POSTGRES_DB: evmonitor
      # ใช้ตอนสร้างฐานข้อมูลครั้งแรกเท่านั้น (volume ว่าง) — SEED_DEMO=false = กองยานว่างเปล่าสำหรับใช้งานจริง (ดู db/init/03_demo.sh)
      SEED_DEMO: ${SEED_DEMO:-true}
      ORG_NAME: ${ORG_NAME:-}
      FLEET_NAME: ${FLEET_NAME:-}
      ORG_CITY: ${ORG_CITY:-}
      ORG_LAT: ${ORG_LAT:-}
      ORG_LNG: ${ORG_LNG:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # เปิดให้เครื่องนี้เท่านั้น (ใช้ต่อ psql / รันชุดทดสอบของ API) ไม่เปิดสู่เครือข่ายภายนอก
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    restart: unless-stopped

  # สำรองฐานข้อมูลอัตโนมัติ: pg_dump ทุกวัน (ค่าเริ่มต้นตี 2 เวลาไทย) → ./backups เก็บ 14 วัน (อย่างน้อย 3 ไฟล์) · ดู db/README.md
  # ไฟล์สำรองในเครื่องอยู่ที่เดียวกับฐานข้อมูล — ตั้ง OFFSITE_* ใน .env เพื่อส่งสำเนาเข้ารหัสออกนอกเครื่องอัตโนมัติ (กันดิสก์/เครื่องเสีย/แรนซัมแวร์)
  backup:
    build:
      context: ./db
      dockerfile: Dockerfile.backup
    image: ev-monitor-backup:latest
    entrypoint: ["sh", "/backup/run.sh"]
    environment:
      PGHOST: db
      PGUSER: evm
      PGDATABASE: evmonitor
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR_TH: ${BACKUP_HOUR_TH:-2}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_ON_START: ${BACKUP_ON_START:-true}
      # ส่งออกนอกเครื่องแบบเข้ารหัส (ไม่ตั้ง OFFSITE_TARGET = ปิด) — ดู db/README.md
      OFFSITE_TARGET: ${OFFSITE_TARGET:-}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
      OFFSITE_KEEP_MIN: ${OFFSITE_KEEP_MIN:-5}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${OFFSITE_S3_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ./db/backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ${OFFSITE_LOCAL_DIR:-./backups-offsite}:/offsite
    depends_on:
      db:
        condition: service_healthy
    # healthy = มีไฟล์สำรองใหม่กว่า 26 ชั่วโมง (ถ้าสำรองหยุดทำงานจะขึ้น unhealthy)
    healthcheck:
      test: ["CMD", "sh", "/backup/check.sh"]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m
    restart: unless-stopped

  api:
    build: ./api
    image: ev-monitor-api:latest
    environment:
      DATABASE_URL: postgres://evm:${POSTGRES_PASSWORD}@db:5432/evmonitor
      AUTH_SECRET: ${AUTH_SECRET:?กำหนด AUTH_SECRET ในไฟล์ .env (ดู .env.example)}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # จำนวนพร็อกซีที่เชื่อถือหน้า API (เว็บ = 1) — ห้ามเชื่อ X-Forwarded-For ที่ผู้เรียกใส่เอง (ดู SECURITY.md)
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # เก็บบันทึกกิจกรรม (audit log) กี่วัน (ขั้นต่ำ 30)
      AUDIT_KEEP_DAYS: ${AUDIT_KEEP_DAYS:-365}
      # ชั่วโมง (เวลาไทย 0–19) ที่ส่งสรุปรายวันทางอีเมล
      DIGEST_HOUR_TH: ${DIGEST_HOUR_TH:-8}
      # job ตรวจรถออฟไลน์ทำงานทุกกี่วินาที (0 = ปิด)
      OFFLINE_CHECK_INTERVAL_SECONDS: ${OFFLINE_CHECK_INTERVAL_SECONDS:-60}
      # อีเมลลืมรหัสผ่าน: ตั้ง SMTP_URL (เช่น smtp://user:pass@host:587) — ไม่ตั้ง = ไม่ส่งอีเมล (ผู้ดูแลสร้างลิงก์รีเซ็ตให้ที่หน้าตั้งค่าได้)
      # LINE Messaging API: ตั้งทั้งสองค่าจึงเปิดใช้แจ้งเตือนเข้า LINE (ไม่ตั้ง = ไม่ส่ง)
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      LINE_TO: ${LINE_TO:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-EV Monitor <no-reply@evmonitor.local>}
      # ที่อยู่เว็บที่ใช้สร้างลิงก์ในอีเมล (ไม่ใช้ Host จาก request)
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # เปิดให้เครื่องนี้ (อุปกรณ์ในเครือข่ายภายในควรเรียกผ่านพร็อกซี/ไฟร์วอลล์ที่ควบคุมเอง) — เอกสาร API ที่ /docs
      - "127.0.0.1:${API_PORT:-4000}:4000"
    restart: unless-stopped

  web:
    build:
      context: ./app
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_DEMO_LOGIN: ${NEXT_PUBLIC_DEMO_LOGIN:-}
    image: ev-monitor-web:latest
    environment:
      API_INTERNAL_URL: http://api:4000
      AUTH_SECRET: ${AUTH_SECRET:?กำหนด AUTH_SECRET ในไฟล์ .env (ดู .env.example)}
      # true เมื่อมี reverse proxy ของเราอยู่หน้าเว็บและตั้ง X-Forwarded-For เอง (ดู app/src/proxy.ts) — เปิดพอร์ตเว็บตรงให้เป็น false
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # เปิด HTTPS ด้วย Caddy แล้วให้ตั้ง WEB_BIND=127.0.0.1 เพื่อไม่เปิดเว็บแบบ HTTP ตรงสู่ภายนอก (ดู README หัวข้อ "เปิดใช้ HTTPS")
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  # Reverse proxy HTTPS (Caddy) — ไม่ทำงานโดยปริยาย เปิดด้วย:  docker compose --profile https up -d
  # ขอ/ต่ออายุใบรับรอง Let's Encrypt ให้เอง เมื่อตั้ง DOMAIN และเปิดพอร์ต 80/443 · ค่าที่ต้องตั้งคู่กันอยู่ใน .env.example หัวข้อ HTTPS
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL_LINE: ${ACME_EMAIL:+email }${ACME_EMAIL:-}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # ใบรับรองและกุญแจ — ต้องคงไว้ (ลบแล้วจะขอใหม่และอาจชนเพดานของ Let's Encrypt)
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"         # HTTP/3
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # ตัวจำลอง telemetry สำหรับเดโม — ไม่ทำงานโดยปริยาย เปิดด้วย:  docker compose --profile demo up -d
  # (ถ้าไม่มี telemetry ไหลเข้า job ตรวจออฟไลน์จะตั้งรถเดโมทั้งกองเป็นออฟไลน์หลัง ~30 นาที ซึ่งเป็นพฤติกรรมที่ถูกต้อง)
  simulator:
    profiles: ["demo"]
    image: ev-monitor-api:latest
    command: ["node", "dist/simulate.js"]
    # ใช้อิมเมจเดียวกับ API ซึ่งมี HEALTHCHECK ยิง :4000/healthz แต่ตัวจำลองไม่ได้เปิดพอร์ต จึงขึ้น unhealthy ตลอด — ปิดไว้
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgres://evm:${POSTGRES_PASSWORD}@db:5432/evmonitor
      API_URL: http://api:4000
      INGEST_API_KEY: ${INGEST_API_KEY:?ต้องตั้ง INGEST_API_KEY ใน .env เพื่อใช้ตัวจำลอง}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-30}
      # true = ส่งข้อมูลของรถทุกคัน รวมที่ออฟไลน์อยู่ (ปลุกรถเดโมให้กลับมา) — ค่าเริ่มต้นไม่ปลุก
      SIM_REVIVE: ${SIM_REVIVE:-false}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # กล่องจดหมายทดสอบ (เฉพาะ profile demo) — ตั้ง SMTP_URL=smtp://mailpit:1025 ใน .env แล้วเปิดอ่านอีเมลที่ http://localhost:8025
  mailpit:
    profiles: ["demo"]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
